[pytest]
pythonpath = .
# zarr's pytest plugin imports numpy before any conftest runs, so the root conftest's OPENBLAS_CORETYPE (the
# Zen 4 workaround) comes too late outside an activated env; no test uses zarr
addopts = -p no:zarr
markers =
    slow: long-running
    realdata: needs a processed real-data series (BEARMIND_TEST_SERIES); skipped otherwise
