# Stage sections are hashed into each stage's parameters (runner.stage_params): adding or changing a key
# in a section re-runs that stage, and every stage after it, for every session. crop.box / crop.box_pos
# and the thresholds (cnmf.gSig / min_corr / min_pnr) are written by the pipeline and are inputs of the
# later stages only (MC, CNMF).
scan:
  max_mismatch_frac: 0.02
  gap_factor: 2.0
  fps_series_dev: 0.05
  # Scan tab only (read from defaults < series config; no stage hash includes it): a dropped_frames line counts
  # as a problem when its longest gap exceeds max_gap_s or the frames lost exceed this share of the session's
  # frames; below both it is shown as information. The scan's anomaly levels do not depend on it.
  dropped_frames_warn: {max_gap_s: 1.0, share: 0.01}
crop:
  # frames read for detection: three windows of sample_frames / 3 at the start, middle and end of the session
  sample_frames: 3000
  margin_px: 10
  min_fov_frac: 0.05
  fov_threshold_frac: 0.2
  # activity: the field covers where calcium transients are (CNMF-E seed maps against their sign-inverted null)
  # inside the lit area; brightness: the lit area only (the rule before 2026-11)
  fov_method: activity
  activity_mass_cut: 0.005
  activity_margin_px: 20
# splits_rig is not stored: the MC stage uses ceil(T/500).
# memory_fact is dropped: it is a CNMF patch parameter that MotionCorrect ignores.
mc:
  pw_rigid: false
  max_shifts: [35, 35]
  gSig_filt: [8, 8]
  strides: [48, 48]
  overlaps: [24, 24]
  max_deviation_rigid: 15
  border_nan: copy
  niter_rig: 1
  use_cuda: false
memory:
  patch_gb_per_mframe: {1: 245, 2: 163}
  # compute_W of CaImAn 1.13.2 (docs/superpowers/specs/2026-10-31-caiman-memory.md): peak bytes per uint8
  # pixel-frame at ssub_B 2; every large array in it is (pixels / ssub_B^2) x T, so the peak scales as (2 / ssub_B)^2
  compute_w_bytes_per_px_frame: 5.05
  # held besides compute_W: the stage process after import caiman (4.65 GiB), idle patch workers (0.67 GiB each),
  # dense A and C
  cnmf_base_gib: 8
  # strongest background downsampling the batch applies by itself
  max_ssub_B: 4
thresholds:
  gsig_range: [3, 4, 5, 6, 7]
  # Thresholds window only (not inputs of the stage hash): the smallest group of passing pixels that counts
  # as a blob, and the slider start values when the autotune gave no suggestion.
  min_blob_px: 2
  fallback: {min_corr: 0.85, min_pnr: 8}
# gSig, min_corr, min_pnr come from the session config; gSiz = 4*gSig + 1; fr = session FPS.
cnmf:
  decay_time: 1
  method_init: corr_pnr
  K: null
  merge_thr: 0.8
  p: 1
  tsub: 1
  ssub: 1
  rf: 40
  stride: 25
  only_init: true
  nb: 0
  nb_patch: 0
  method_deconvolution: oasis
  low_rank_background: null
  update_background_components: true
  normalize_init: false
  center_psf: true
  ssub_B: 2
  ring_size_factor: 1.5
  del_duplicates: true
  border_pix: 5
  min_SNR: 2.5
  rval_thr: 0.95
  use_cnn: false
autoinspect:
  brain: hybrid
  model_path: production_models/ebm_v9_iter8.pkl
  ml_threshold: 0.72
  n_iter: 3
  detect_corner_artifacts: false
  correlation_method: spearman
  cthr: 0.35
  corr_thr: 0.4
  # FBD merge cutoff (px). 15 is conservative: most NMF duplicates have FBD <= 10; the band 10-15 catches edge cases
  # without merging distinct neighbouring cells.
  pxlthr_distance_boundary: 15
  d_snr_thr: 10
  enable_merge: true
  include_event_based: true
  include_heavy: true
  event_method: wavelet
  hybrid_kinetics: true
  # seed of driada's tie-breaking noise (1e-8 per frame): with a fixed seed two runs give the same decisions; null: unseeded
  seed: 0
gate:
  enabled: true
# The inspection server of the series (python -m bearmind inspect); not stage parameters (no stage hash includes
# them). port 0 takes a free port; the server stops after idle_exit_s seconds without an open browser tab.
# webgl: traces drawn by the GPU; trace_points: at most this many points per trace go to the browser. wave: the
# calcium-wave hint on the session page: a component is active in a frame when its C is above
# median + k_mad x max(1.4826 x MAD, sn) of its trace (sn: its noise SD, estimates.neurons_sn); sn is the noise
# SD only for components with a real residual: for residual-free components it is GetSn of the nearly
# noise-free C, so the rule acts as a minimum event size (3 raw noise SDs), not a significance test. A frame is
# a wave frame when at least active_frac of the kept components, and at least 3, are active; no hint below 10
# kept components. The hint shows when the share of wave frames is above warn_frac (null: never). warn_frac
# 0.025: just above the 99th percentile (0.0228) of the 106 sessions of the May 2026 paper corpus (CC 33, RFC 52,
# FOF 21) on their CNMF-E estimates, as the page sees them, 2026-11-08; the scan and its table are in
# docs/superpowers/specs/wave-frac-2026-11-08. Re-check it on the first batch outputs (LT1): the server logs the
# share of every prepared session.
inspection:
  port: 0
  idle_exit_s: 600
  webgl: true
  trace_points: 2000
  wave: {k_mad: 3.0, active_frac: 0.3, warn_frac: 0.025}
# MC checks: provisional, from 6 real sessions (task 17, docs/superpowers/specs/2026-11-01-e2e-report.md):
# max shift 2.2-4.6 px, template corr 0.82-0.94; a uniform 2 px misalignment lowers the corr to 0.57-0.75.
# The cnmf / autoinspect / export values are the initial guesses: they need production data.
checks:
  mc_max_shift_px: {warn: 10, error: 30}
  mc_template_corr: {warn: 0.7}
  cnmf_n_components_vs_median: {warn: 2.0, error: 3.0}
  cnmf_missed_cells: {warn: 20}
  auto_deleted_frac: {warn: 0.8, error: 0.95}
  export_n_neurons: {warn: 30, error: 5}
  export_median_snr: {warn: 3.0}
  min_sessions_for_relative: 3
# Worker processes of CaImAn pools. Not stage parameters (no stage hash includes them): rigid MC corrects
# each of its ceil(T/500) splits on its own, and pools of 31, 16 and 8 gave the same shifts (to 0.000 px);
# 16 ran as fast as 31 with less memory (docs/superpowers/specs/2026-11-01-e2e-report.md). At most n_cpus - 1.
pool:
  mc_processes: 16
# How the runner runs stages; not stage parameters (no stage hash includes them).
runner:
  # each stage in a child process: a crash or a dead CaImAn pool worker fails the stage, not the batch
  isolate_stages: true
  # automatic re-runs per run of a stage whose process crashed (0: none); other failures are not re-run
  max_auto_retries: 1
  # minutes without CPU progress of the stage process tree after which the stage is killed and counts as
  # crashed (0: no limit). CPU time, not output: a stage that computes silently is healthy; a deadlock or
  # a wait on stuck I/O uses no CPU.
  stall_timeout_min: 30
preview:
  enabled: false   # the checkbox: MC previews and the CNMF-E QC video
  tbin: 2          # frames averaged per preview frame
  ssub: 1          # pixels per side averaged per preview pixel (1 = full size)
  crf: 23          # crf and speed: raw and mc previews; the dF/F and QC videos keep their own
  speed: 4
# Monitor window model (not stage parameters). eta_s_per_frame: seconds per frame of each stage, used for the
# time-left estimate until the series has two finished runs of that stage (medians of the tables in
# docs/superpowers/specs/2026-11-01-e2e-report.md: mc and thresholds from series1; cnmf, autoinspect and
# export from series_short, whose fixed costs dominate, so they overestimate long sessions). No number for gate:
# it is a person's decision. crop: the activity-based field of view reads three windows and builds the seed maps,
# 60-100 s per session whatever the session length, so it has seconds per session (eta_s_per_session).
monitor:
  refresh_ms: 2000
  heartbeat_dead_s: 120
  eta_s_per_frame:
    mc: 0.046
    thresholds: 0.071
    cnmf: 0.14
    autoinspect: 0.017
    export: 0.0005
  eta_s_per_session:
    crop: 90
