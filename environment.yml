# BEARMiND Environment - Windows 10+ Portable
#
# INSTALLATION (recommended - use mamba for 10x faster solving):
#   conda install -n base mamba -c conda-forge
#   mamba env create -f environment.yml
#   conda activate bearmind
#   pip install -r requirements-pip.txt
#
# Alternative (slower but works):
#   conda env create -f environment.yml
#   conda activate bearmind
#   pip install -r requirements-pip.txt
#
# Or use install.bat for one-click installation
#
# Python 3.10 required (CaImAn + TensorFlow 2.10 compatibility)
# All versions tested and verified to work together

name: bearmind

channels:
  - conda-forge
  - defaults

dependencies:
  # Python - pinned for CaImAn/TensorFlow compatibility
  - python=3.10

  # === CAIMAN STACK (neuroscience core) ===
  - caiman=1.11.3

  # === DEEP LEARNING ===
  - tensorflow=2.10.0
  - keras=2.10.0

  # === SCIENTIFIC COMPUTING ===
  - numpy=1.26.4
  - scipy=1.14.1
  - pandas=2.2.2
  - h5py>=3.11.0

  # === MACHINE LEARNING ===
  - scikit-learn=1.5.1
  - scikit-image=0.24.0
  - joblib=1.4.2

  # === VISUALIZATION ===
  - bokeh=3.4.2
  - matplotlib=3.9.1
  - holoviews=1.19.1
  - panel=1.4.5
  - colorcet=3.1.0
  - pyqtgraph=0.13.7

  # === JUPYTER ECOSYSTEM ===
  - jupyter=1.0.0
  - jupyterlab=4.2.4
  - notebook=7.2.1
  - ipykernel=6.29.5
  - ipywidgets=8.1.5
  - jupyter_bokeh=4.0.5

  # === IMAGE/VIDEO PROCESSING ===
  - tifffile=2023.8.12
  - imageio=2.35.1
  - imagecodecs=2023.1.23
  - pillow=9.4.0
  - av=11.0.0
  - ffmpeg=6.0.0
  - pims=0.7

  # === NWB FORMAT SUPPORT ===
  - pynwb=2.8.1
  - hdmf=3.14.3

  # === UTILITIES ===
  - tqdm=4.66.5
  - natsort=7.1.1
  - pyyaml=6.0.2
  - zarr=2.18.2
  - networkx=3.3
  - psutil=6.0.0
  - numcodecs=0.13.0
  - pytz=2024.1
  - ruamel.yaml=0.18.6

  # === SIGNAL PROCESSING ===
  - peakutils=1.3.5
  - pywavelets=1.7.0
  - slicerator=1.1.0

  # === JUPYTER EXTRAS ===
  - ipyparallel=8.8.0
  - qtconsole=5.5.2

  # === SYSTEM ===
  - pip>=24.0
