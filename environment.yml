# BEARMiND environment (Windows 10+)
#
# INSTALLATION:
#   mamba env create -f environment.yml
#   conda activate bearmind
#   pip install -r requirements-pip.txt
#
# CaImAn 1.13.2 is the latest release (2026-08-02): NumPy 2, PyTorch instead of
# TensorFlow, Qt via PySide6. Python 3.12 is the newest version it is built for.

name: bearmind

channels:
  - conda-forge

dependencies:
  - python=3.12.16
  - caiman=1.13.2

  # BLAS: OpenBLAS. The lab machines are AMD (Ryzen 9 7950X3D), where MKL gains
  # little, and newer conda-forge MKL builds (mkl 2024.2.2 + llvm-openmp) hard-crash
  # numpy/scipy linalg on Windows with 0xc06d007f.
  # WORKAROUND: OpenBLAS 0.3.34 does not recognise Zen 4 and its AVX2 dgemm kernels
  # segfault (e.g. 2000x239 . 239x600 float64, CaImAn compute_W). bearmind/__init__.py,
  # tests/conftest.py and the conda env variable set OPENBLAS_CORETYPE=Sandybridge.
  # TODO proper fix: an OpenBLAS build that knows Zen 4, or MKL (currently unsolvable
  # next to this stack because of blas-devel).
  - libblas=*=*openblas

  # caiman pulls numpy, scipy, scikit-image, scikit-learn, opencv, av, pims,
  # bokeh, panel, holoviews, pyqtgraph, pyside6, pytorch, tifffile, h5py, zarr,
  # pynwb, psutil, ipyparallel and jupyter.

  # Video I/O: FFV1 intermediate (3_MC) and mp4 previews
  - ffmpeg=9.0.2
  - av=19.0.2
  - numpy=2.5.4
  - scipy=1.18.1
  - opencv=5.0.0

  # Utilities
  - natsort=8.4.0
  - pyyaml=6.0.3
  - tqdm=4.70.1
  - pywavelets=1.10.0

  - pip
